<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0055FF;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
            <feOffset dx="0" dy="10" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    
    <!-- Background Squircle -->
    <rect x="128" y="128" width="768" height="768" rx="180" fill="url(#bgGradient)" filter="url(#shadow)" />
    
    <!-- Grid Zones -->
    <g stroke="white" stroke-width="32" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Main Grid Outline -->
        <rect x="256" y="256" width="512" height="512" rx="40" opacity="0.9" />
        
        <!-- Vertical Divider -->
        <line x1="512" y1="256" x2="512" y2="768" opacity="0.9" />
        
        <!-- Horizontal Dividers (Right Side Split) -->
        <line x1="512" y1="512" x2="768" y2="512" opacity="0.9" />
        
        <!-- "Snap" Target Indicator (Left Side) -->
        <rect x="288" y="288" width="192" height="448" rx="20" fill="white" fill-opacity="0.3" stroke="none" />
    </g>
    
    <!-- Corner Accents -->
    <g fill="white" opacity="0.5">
        <circle cx="256" cy="256" r="12" />
        <circle cx="768" cy="256" r="12" />
        <circle cx="256" cy="768" r="12" />
        <circle cx="768" cy="768" r="12" />
    </g>
</svg>
